<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Notifications | FixMyCampus</title>

    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/notifications.css" />
    <link rel="stylesheet" href="../css/staff-notifications.css" />
  </head>

  <body>
    <div class="dashboard-layout">
      <aside class="dashboard-sidebar">
        <div class="sidebar-brand">
          <a href="dashboard.html">FixMyCampus</a>
        </div>

        <nav class="sidebar-nav">
          <a href="dashboard.html" class="sidebar-link">
            <span class="sidebar-icon">⌂</span>
            <span>Dashboard</span>
          </a>

          <a href="dashboard.html#assignedComplaints" class="sidebar-link">
            <span class="sidebar-icon">▤</span>
            <span>Assigned Complaints</span>
          </a>

          <a href="notifications.html" class="sidebar-link active">
            <span class="sidebar-icon">♧</span>
            <span>Notifications</span>
          </a>

          <a href="profile.html" class="sidebar-link">
            <span class="sidebar-icon">◉</span>
            <span>Profile</span>
          </a>

          <a href="settings.html" class="sidebar-link">
            <span class="sidebar-icon">⚙</span>
            <span>Settings</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <div class="sidebar-user">
            <div id="sidebarAvatar" class="profile-avatar">ST</div>

            <div class="sidebar-user-info">
              <strong id="sidebarUserName"> Loading... </strong>

              <span>Staff</span>
            </div>
          </div>

          <button id="logoutButton" class="sidebar-logout" type="button">
            <span class="sidebar-icon">↪</span>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <div class="dashboard-content">
        <header class="dashboard-header">
          <div class="dashboard-header-content">
            <div class="dashboard-search">
              <span class="search-icon">⌕</span>

              <input
                type="text"
                placeholder="Search notifications..."
                aria-label="Search notifications"
              />
            </div>

            <div class="user-area">
              <div class="notification-wrapper">
                <button
                  id="notificationButton"
                  class="notification-button"
                  type="button"
                  aria-label="Notifications"
                >
                  <span class="notification-icon"> 🔔 </span>

                  <span
                    id="notificationBadge"
                    class="notification-badge"
                    style="display: none"
                  >
                    0
                  </span>
                </button>

                <div
                  id="notificationPanel"
                  class="notification-panel"
                  style="display: none"
                >
                  <div class="notification-header">
                    <h3>Notifications</h3>

                    <button id="markAllReadButton" type="button">
                      Mark all as read
                    </button>
                  </div>

                  <div id="notificationList" class="notification-list"></div>
                </div>
              </div>

              <a href="profile.html" class="user-profile">
                <div id="profileAvatar" class="profile-avatar">ST</div>

                <span id="staffName" class="user-name"> Staff </span>
              </a>
            </div>
          </div>
        </header>

        <main class="dashboard-main">
          <div class="dashboard-container">
            <section class="notifications-page-header">
              <div>
                <span class="section-label"> UPDATES </span>

                <h1>Notifications</h1>

                <p>
                  Stay updated about your assigned complaints, status changes
                  and messages.
                </p>
              </div>
            </section>

            <section class="notifications-page-card">
              <div class="notifications-page-card-header">
                <div>
                  <span class="section-label"> ACTIVITY </span>

                  <h2>Your Notifications</h2>
                </div>

                <button
                  id="pageMarkAllReadButton"
                  class="notifications-mark-all"
                  type="button"
                >
                  Mark all as read
                </button>
              </div>

              <div id="pageNotificationList" class="page-notification-list">
                <div class="notification-loading">Loading notifications...</div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="../js/staff-notifications.js"></script>
    <script src="../js/staff-profile-loader.js"></script>
  </body>
</html>
