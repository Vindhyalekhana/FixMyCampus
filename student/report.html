<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>File a Complaint | FixMyCampus</title>

    <link rel="stylesheet" href="../css/dashboard.css" />

    <link rel="stylesheet" href="../css/notifications.css" />
  </head>

  <body>
    <div class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="dashboard-sidebar">
        <div class="sidebar-brand">
          <a href="dashboard.html"> FixMyCampus </a>
        </div>

        <nav class="sidebar-nav">
          <a href="dashboard.html" class="sidebar-link">
            <span class="sidebar-icon">⌂</span>
            <span>Dashboard</span>
          </a>

          <a href="report.html" class="sidebar-link active">
            <span class="sidebar-icon">＋</span>
            <span>File Complaint</span>
          </a>

          <a href="dashboard.html#complaints" class="sidebar-link">
            <span class="sidebar-icon">▤</span>
            <span>My Complaints</span>
          </a>

          <a href="notifications.html" class="sidebar-link">
            <span class="sidebar-icon">♧</span>
            <span>Notifications</span>
          </a>

          <a href="profile.html" class="sidebar-link">
            <span class="sidebar-icon">◉</span>
            <span>Profile</span>
          </a>

          <a href="settings.html" class="sidebar-link">
            <span class="sidebar-icon">⚙</span>
            <span>Settings</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <a href="profile.html" class="sidebar-user dashboard-profile-link">
            <div id="sidebarAvatar" class="profile-avatar">ST</div>

            <div class="sidebar-user-info">
              <strong id="sidebarUserName"> Student </strong>

              <span> Student </span>
            </div>
          </a>

          <button id="logoutButton" class="sidebar-logout" type="button">
            <span class="sidebar-icon"> ↪ </span>

            <span> Logout </span>
          </button>
        </div>
      </aside>

      <!-- Main content -->
      <div class="dashboard-content">
        <!-- Header -->
        <header class="dashboard-header">
          <div class="dashboard-header-content">
            <div class="dashboard-search">
              <span class="search-icon"> ⌕ </span>

              <input
                type="text"
                id="complaintSearch"
                placeholder="Search complaints..."
                aria-label="Search complaints"
              />
            </div>

            <div class="user-area">
              <!-- Notifications -->
              <div class="notification-wrapper">
                <a
                  href="notifications.html"
                  class="notification-button dashboard-profile-link"
                  aria-label="Notifications"
                >
                  <span class="notification-icon"> 🔔 </span>
                </a>
              </div>

              <!-- User profile -->
              <a
                href="profile.html"
                class="user-profile dashboard-profile-link"
              >
                <div id="profileAvatar" class="profile-avatar">ST</div>

                <span id="studentName" class="user-name"> Student </span>
              </a>
            </div>
          </div>
        </header>

        <!-- Main -->
        <main class="dashboard-main">
          <div class="dashboard-container">
            <!-- Page introduction -->
            <section class="dashboard-welcome">
              <div>
                <span class="welcome-label"> STUDENT PORTAL </span>

                <h1>File a Complaint</h1>

                <p>
                  Report a campus infrastructure problem to the appropriate
                  staff.
                </p>
              </div>

              <div class="welcome-decoration"></div>
            </section>

            <!-- Complaint form -->
            <section class="complaint-form-section">
              <div class="complaint-form-card">
                <form id="complaintForm">
                  <div class="form-group">
                    <label for="category"> Category </label>

                    <select
                      id="category"
                      name="category_id"
                      class="form-control"
                      required
                    >
                      <option value="">Select a category</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="location"> Location </label>

                    <select
                      id="location"
                      name="location_id"
                      class="form-control"
                      required
                    >
                      <option value="">Select a location</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="title"> Complaint Title </label>

                    <input
                      type="text"
                      id="title"
                      name="title"
                      class="form-control"
                      placeholder="Example: Broken classroom fan"
                      maxlength="200"
                      required
                    />
                  </div>

                  <div class="form-group">
                    <label for="description"> Description </label>

                    <textarea
                      id="description"
                      name="description"
                      class="form-control"
                      placeholder="Describe the problem clearly..."
                      required
                    ></textarea>
                  </div>

                  <div class="form-group">
                    <label for="priority"> Priority </label>

                    <select
                      id="priority"
                      name="priority"
                      class="form-control"
                      required
                    >
                      <option value="">Select priority</option>

                      <option value="Low">Low</option>

                      <option value="Medium">Medium</option>

                      <option value="High">High</option>
                    </select>
                  </div>

                  <div
                    id="complaintMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                  ></div>

                  <div class="form-actions">
                    <button type="reset" class="btn btn-secondary">
                      Clear
                    </button>

                    <button
                      type="submit"
                      class="btn btn-primary"
                      id="submitComplaintButton"
                    >
                      Submit Complaint
                    </button>
                  </div>
                </form>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="../js/report.js"></script>
  </body>
</html>
